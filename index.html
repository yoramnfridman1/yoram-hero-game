<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fff7ec">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23d84a2b'/%3E%3Cpath d='M18 43h28l4-22-12 8-6-13-6 13-12-8z' fill='%23ffe6a1'/%3E%3C/svg%3E">
<title>יורם הגיבור — המסע של יורם פרידמן</title>
<style>
:root{
  --bg1:#fff7ec; --bg2:#ffe7d0;
  --ink:#4a2c17; --muted:#7a5a3f;
  --card:#ffffff;
  --accent:#d84a2b; --accent-dark:#b83a20;
  --red:#d81e2b;
  --gold:#e8a33d;
  --border:#f3ddc4;
  --shadow:0 8px 24px rgba(122,80,40,.14);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Heebo','Assistant',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  background:linear-gradient(180deg,var(--bg1),var(--bg2));
  background-attachment:fixed;
  color:var(--ink);
  min-height:100vh;
  font-size:18px; line-height:1.55;
  -webkit-tap-highlight-color:transparent;
  -webkit-text-size-adjust:100%;
}
#app{min-height:100vh; display:flex; flex-direction:column; align-items:center;}
.screen{display:none; width:100%; max-width:560px; padding:24px 16px 32px; flex:1; flex-direction:column; align-items:center; text-align:center;}
.screen.active{display:flex;}

h1{font-size:2.3rem; line-height:1.15; margin:14px 0 2px; font-weight:800;}
h2{font-size:1.8rem; line-height:1.2; margin:8px 0 4px; font-weight:800;}
.subtitle{font-size:1.3rem; color:var(--muted); margin:0 0 22px; font-weight:600;}
.accent-red{color:var(--red);}

.card{background:var(--card); border-radius:26px; box-shadow:var(--shadow); padding:24px 20px; width:100%;}

/* Buttons */
.btn{
  font-family:inherit; font-size:1.3rem; font-weight:800;
  border:none; border-radius:999px; cursor:pointer;
  padding:16px 34px; min-height:58px; min-width:220px;
  color:#fff; background:linear-gradient(180deg,#ef6a3a,var(--accent));
  box-shadow:0 7px 18px rgba(216,74,43,.32);
  transition:transform .12s ease;
}
.btn:active{transform:translateY(2px) scale(.99);}
.btn-big{font-size:1.6rem; padding:22px 48px; min-height:68px;}
.btn-ghost{background:var(--card); color:var(--ink); box-shadow:var(--shadow); border:2px solid var(--border);}
.btn:focus-visible{outline:3px solid var(--accent); outline-offset:3px;}

/* Home */
.hero-figure{position:relative; margin:4px 0 6px;}
.hero-figure img{width:min(68vw,250px); max-height:42vh; object-fit:contain; border-radius:24px; display:block; margin:0 auto;}
.figure-fallback{
  display:none; width:min(68vw,250px); height:min(68vw,250px); margin:0 auto;
  border-radius:50%; background:linear-gradient(160deg,#ffe3c2,#ffd0a0);
  align-items:center; justify-content:center; flex-direction:column; gap:2px;
  box-shadow:var(--shadow); border:5px solid #fff;
}
.figure-fallback .big{font-size:4.4rem; line-height:1;}
.figure-fallback .lbl{font-size:1.25rem; font-weight:800; color:var(--accent-dark);}

/* Level intro */
.intro-badge{font-size:3.2rem; line-height:1; margin-bottom:4px;}
.intro-line{font-size:1.25rem; font-weight:700; color:var(--accent-dark); margin:8px 0 18px;}

/* Board */
.board-frame{
  background:var(--card); border-radius:26px; padding:14px;
  box-shadow:var(--shadow); border:3px solid var(--border);
  width:100%; max-width:430px;
}
.board-frame.red{border-color:var(--red); box-shadow:0 8px 24px rgba(216,30,43,.22);}
.level-label{font-size:1.05rem; color:var(--muted); font-weight:700; margin:0 0 2px;}
.board-name{font-size:1.5rem; font-weight:800; margin:0 0 6px;}
.counter{font-size:1.35rem; font-weight:800; margin:4px 0 12px;}
.counter b{color:var(--accent); font-size:1.55rem;}
.counter .tgt{font-size:1.6rem;}
.board{display:grid; grid-template-columns:repeat(6,1fr); gap:6px;}
.cell{
  aspect-ratio:1; min-height:52px; border:none; border-radius:14px;
  display:flex; align-items:center; justify-content:center;
  font-size:2rem; cursor:pointer; position:relative;
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.09), 0 2px 4px rgba(0,0,0,.06);
  transition:transform .18s ease, box-shadow .18s ease, opacity .22s ease;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
}
.cell[data-type="fruit"]{background:#cbeccf;}
.cell[data-type="ball"]{background:#ffd9b8;}
.cell[data-type="shield"]{background:#d6e5ff;}
.cell[data-type="plane"]{background:#d4efff;}
.cell[data-type="heart"]{background:#ffd6e0;}
.cell[data-type="faith"]{background:#ffeec4;}
.cell.selected{box-shadow:0 0 0 3px var(--ink), inset 0 0 0 3px #fff; transform:scale(1.05); z-index:2;}
.cell.hint{animation:hintpulse .28s ease-in-out;outline:4px solid #3f210f;outline-offset:-4px;z-index:2;}
.cell.pop{animation:pop .24s ease forwards;}
.cell.fall-in{animation:fallin .24s ease;}
.cell.shake{animation:shake .26s ease;}
.cell.swap-flash{animation:swapflash .2s ease;}
@keyframes hintpulse{0%,100%{box-shadow:0 0 0 0 var(--gold);}50%{box-shadow:0 0 0 5px var(--gold);}}
@keyframes pop{0%{transform:scale(1); opacity:1;}60%{transform:scale(1.25); opacity:1;}100%{transform:scale(0); opacity:0;}}
@keyframes fallin{0%{transform:translateY(-20px); opacity:0;}100%{transform:translateY(0); opacity:1;}}
@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}
@keyframes swapflash{0%{transform:scale(1);}50%{transform:scale(1.15);}100%{transform:scale(1);}}
.board-actions{margin-top:16px; display:flex; flex-direction:column; gap:10px; width:100%; align-items:center;}

/* Hero card / finale */
.portrait{position:relative;}
.portrait img{width:min(52vw,190px); height:min(52vw,190px); object-fit:cover; border-radius:50%; border:5px solid #fff; box-shadow:var(--shadow); display:block; margin:0 auto;}
.portrait-fallback{
  display:none; width:min(52vw,190px); height:min(52vw,190px); margin:0 auto;
  border-radius:50%; background:linear-gradient(160deg,#ffe3c2,#ffd0a0);
  align-items:center; justify-content:center; flex-direction:column; gap:2px;
  box-shadow:var(--shadow); border:5px solid #fff;
}
.portrait-fallback .big{font-size:3.6rem; line-height:1;}
.portrait-fallback .lbl{font-size:1.15rem; font-weight:800; color:var(--accent-dark);}
.card-title{font-size:1.5rem; font-weight:800; margin:14px 0 2px;}
.card-text{font-size:1.35rem; font-weight:600; line-height:1.5; margin:8px 0 20px;}
.finale-text{font-size:1.4rem; font-weight:700; line-height:1.55; margin:12px 0 22px;}

/* Home (small) button */
.btn-home{
  position:absolute; top:14px; inset-inline-start:14px;
  width:52px; height:52px; border-radius:50%; border:2px solid var(--border);
  background:var(--card); font-size:1.4rem; cursor:pointer; box-shadow:var(--shadow);
  display:flex; align-items:center; justify-content:center; color:var(--ink);
}
.screen{position:relative;}

/* Confetti */
#confetti{position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:50;}
.confetti-bit{position:absolute; top:-6%; animation:fall linear forwards;}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg); opacity:.2;}}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none !important; transition:none !important;}
  .cell.hint{outline:4px solid #3f210f;outline-offset:-4px;box-shadow:inset 0 0 0 7px #fff6c6;z-index:2}
}

/* A warm confectionery world, with large, distinct playing pieces. */
body{background:radial-gradient(ellipse at 50% 0,#fffdf1 0,#f9e8ce 55%,#f2d6b5 100%);color:#573321}
.screen{padding:20px 12px 28px}
#screen-home,#screen-intro,#screen-card,#screen-finale{justify-content:center}
h1{font-size:clamp(2.7rem,11vw,4rem);color:#8f2f2c;text-shadow:0 2px #fff}
.subtitle{color:#75503c}
.hero-figure{background:radial-gradient(circle,#fff9eb 40%,#f3cc98 100%);border:8px solid #fff8e8;border-radius:48% 48% 42% 42%;box-shadow:0 9px 0 #dbb084,0 18px 35px #a16c3e35;padding:8px 18px 0}
.hero-figure img{border-radius:40% 40% 35% 35%}
.btn{background:linear-gradient(#e7644b,#bf302c);box-shadow:inset 0 2px #ffad8d,0 5px 0 #932c26,0 10px 18px #8e432f35}
.btn-ghost{background:#fff8e7;color:#6a3927;box-shadow:0 4px 0 #d1ad87}
.card{background:#fff8e9;border:3px solid #e5bf8a;box-shadow:0 8px 0 #c99467,0 16px 30px #8e5f3d24}
#screen-board{padding-top:12px}
#screen-board .btn-home{top:10px;inset-inline-start:10px}
.level-label{font-size:18px;color:#79503a}
.board-name{font-size:28px;line-height:1.2;max-width:72%;min-height:34px}
.counter{background:#fff9eb;border:2px solid #e8c89b;border-radius:18px;padding:4px 16px;margin:6px 0 10px;box-shadow:0 3px 0 #d6af83}
.counter .tgt{display:inline-flex;vertical-align:middle;width:42px;height:42px}
.board-frame{background:linear-gradient(145deg,#bd7b4a,#925831);border:4px solid #f2d2a4;box-shadow:0 7px 0 #7c4c2d,0 14px 24px #67462b40;padding:8px;border-radius:24px;max-width:430px}
.board{gap:3px;direction:ltr;background:#8e593a;border-radius:14px;padding:3px}
.cell{min-width:0;min-height:52px;border-radius:13px;padding:2px;background:#f1cca1!important;box-shadow:inset 0 2px 6px #75432155,inset 0 -1px 1px #fff6df66;overflow:visible;touch-action:manipulation}
.candy-art{display:block;width:100%;height:100%;max-width:55px;filter:drop-shadow(0 3px 1px #5c2b2355);pointer-events:none}
.cell.selected{outline:3px solid #fff8bd;outline-offset:-3px;box-shadow:0 0 0 3px #8b392a,inset 0 0 0 2px #fff;transform:scale(1.05);z-index:3}
.cell.swap-motion{transition:transform .2s ease;transform:translate(var(--dx),var(--dy));z-index:4}
.cell.fall-in{animation:fallin .24s cubic-bezier(.2,.7,.25,1)}
@keyframes candy-drop{from{transform:translateY(var(--fall-distance))}75%{transform:translateY(3px)}to{transform:translateY(0)}}
.cell.fall-in{animation:candy-drop .25s cubic-bezier(.2,.7,.25,1)}
.board-avatar{position:absolute;top:10px;inset-inline-end:12px;width:52px;height:52px;object-fit:cover;border-radius:50%;border:3px solid #fff8e9;box-shadow:0 0 0 2px #c59a69}
.cell:focus-visible{outline:3px solid #fff;outline-offset:-3px}
.board-actions{margin-top:12px}
#btn-hint{min-width:180px}
.intro-badge{display:flex;justify-content:center;height:92px}.intro-badge .candy-art{max-width:92px}
#intro-scene{display:block;width:100%;max-height:150px;object-fit:cover;border-radius:18px;margin:0 auto 10px}
.candy-symbols{position:absolute;width:0;height:0;overflow:hidden}
.guide{font-size:18px;font-weight:700;line-height:1.3;color:#704b35;margin:7px 0 2px}
.portrait img{border:7px solid #fff9e8;box-shadow:0 0 0 4px #d2a66c,0 12px 28px #724b3038}
.confetti-bit{width:9px;height:16px;border-radius:3px}
@media(max-width:370px){.screen{padding-inline:6px}.board{gap:2px}.board-frame{padding:5px}.cell{min-height:52px}.board-name{font-size:28px}}


/* Chapter environments: a warm keepsake album, with a distinct setting per chapter. */
body{--scene:#f8e9d8;--scene2:#efd0ac;--rim:#a56c49;--table:#d6ae83;--detail:#a86d49}
body[data-chapter="1"]{--scene:#f7e9db;--scene2:#e9c6aa;--rim:#ac6f5d;--table:#e4bd9d;--detail:#ba786e}
body[data-chapter="2"]{--scene:#fce8de;--scene2:#eeb7a8;--rim:#ab3033;--table:#e3a291;--detail:#b63338}
body[data-chapter="3"]{--scene:#f9edda;--scene2:#e8c89e;--rim:#aa774b;--table:#dfbd92;--detail:#ac7951}
body[data-chapter="4"]{--scene:#f7ebd9;--scene2:#d8bf9f;--rim:#8e694e;--table:#d1b293;--detail:#8d6d50}
body[data-chapter="5"]{--scene:#fff2d7;--scene2:#ead1a0;--rim:#a77a35;--table:#e5c89b;--detail:#b88d43}
body[data-chapter="6"]{--scene:#eaf1e6;--scene2:#c4d6bd;--rim:#69836a;--table:#c1d2ba;--detail:#718b70}
body[data-chapter="7"]{--scene:#fcece2;--scene2:#eecbb5;--rim:#b46c58;--table:#e9c5aa;--detail:#b97862}
body[data-chapter="8"]{--scene:#f7eae2;--scene2:#dfc6b8;--rim:#a57368;--table:#dec2b0;--detail:#ae7a70}
body[data-chapter="9"]{--scene:#eff3e5;--scene2:#d1debd;--rim:#779058;--table:#cbdab3;--detail:#829c63}
body[data-chapter="10"]{--scene:#eaf3ef;--scene2:#c3dcd5;--rim:#578579;--table:#bbd8ce;--detail:#648f83}
body[data-chapter]{background:radial-gradient(ellipse at 50% 4%,#fffdf5 0,var(--scene) 46%,var(--scene2) 100%)}
body[data-chapter] .board-frame{background:var(--rim);border-color:#fff2da;box-shadow:0 7px 0 var(--detail),0 14px 24px #67462b40}
body[data-chapter] .board{background:var(--rim)}
body[data-chapter] .cell{background:var(--table)!important}
body[data-chapter] .counter{border-color:var(--detail)}
#screen-board::before{content:"";position:absolute;inset:100px 0 0;z-index:-1;opacity:.18;pointer-events:none;background:repeating-linear-gradient(135deg,transparent 0 27px,var(--detail) 28px 29px,transparent 30px 56px);mask-image:linear-gradient(transparent,#000 26%,transparent 85%)}
body[data-chapter="2"] #screen-board::before{background:repeating-linear-gradient(90deg,transparent 0 32px,var(--detail) 32px 36px,transparent 36px 68px)}
body[data-chapter="4"] #screen-board::before{background:repeating-linear-gradient(0deg,transparent 0 22px,var(--detail) 23px 25px,transparent 26px 48px)}
body[data-chapter="5"] #screen-board::before{background:radial-gradient(ellipse at 50% 15%,var(--detail),transparent 57%)}
body[data-chapter="9"] #screen-board::before{background:radial-gradient(circle,var(--detail) 2px,transparent 3px);background-size:30px 30px}
body[data-chapter="10"] #screen-board::before{background:repeating-linear-gradient(165deg,transparent 0 24px,var(--detail) 25px 27px,transparent 28px 54px)}
#screen-card .btn-home{z-index:5}
#screen-card .keepsake{width:100%;max-width:430px;padding:18px 22px 24px;background:#fffaf0;border:3px solid var(--detail);border-radius:36px 36px 24px 24px;box-shadow:0 8px 0 var(--scene2),0 16px 30px #66462c22;position:relative}
#screen-card .keepsake:before{content:"✦  ✦  ✦";display:block;color:var(--detail);font-size:22px;letter-spacing:9px;margin-bottom:9px}
#screen-card .portrait img{width:min(44vw,170px);height:min(44vw,170px);box-shadow:0 0 0 4px var(--detail),0 12px 28px #724b3038}
#screen-card .card-title{font-size:28px;color:#623c2a;margin-top:14px}
#screen-card .chapter-name{font-size:19px;font-weight:700;color:#704b35;margin:0}
#screen-card .card-text{font-size:1.35rem;color:#4a2c17;margin:12px 0 18px}
#screen-card .reward-mark{width:60px;height:60px;margin:0 auto 8px;padding:4px;border-radius:50%;background:var(--scene);border:2px solid var(--detail)}
#screen-card .reward-mark .candy-art{width:100%;height:100%}
#screen-finale .finale-text{max-width:430px;padding:18px 22px;background:#fffaf0;border:3px solid var(--detail);border-radius:24px;box-shadow:0 6px 0 var(--scene2)}

/* Full-width illustrated chapters keep the story visible above the copy. */

  #screen-board{padding-top:2px}

/* A chapter is a page in a keepsake album, not a floating profile badge. */

.chapter-progress{display:flex;direction:rtl;gap:5px;margin:0 20px 8px;align-items:center}
.chapter-progress span{height:6px;flex:1;background:#dfd2c1;border-radius:8px}
.chapter-progress span.done{background:var(--detail)}
body[data-chapter="2"] #screen-card .keepsake,body[data-chapter="5"] #screen-card .keepsake,body[data-chapter="8"] #screen-card .keepsake{background:var(--scene)}
body[data-chapter="3"] #screen-card .portrait,body[data-chapter="6"] #screen-card .portrait,body[data-chapter="9"] #screen-card .portrait{flex-direction:row-reverse;justify-content:flex-end}
/* Scene-coloured frame and a small chapter illustration on the playing surface. */
body[data-chapter] .board-frame{background-image:var(--chapter-art);background-size:cover;background-position:center;border-width:3px;padding:7px;box-shadow:0 5px 0 var(--detail),0 10px 18px #67462b30}

/* Each piece sits in its own softly lit enamel well. The drawing stays the
   primary symbol; colour is a second cue, never the only identifier. */
body[data-chapter] .cell[data-type="fruit"]{background-image:linear-gradient(145deg,#f5ffe4,#bcdca4)!important}
body[data-chapter] .cell[data-type="ball"]{background-image:linear-gradient(145deg,#fff1e4,#edb9a4)!important}
body[data-chapter] .cell[data-type="shield"]{background-image:linear-gradient(145deg,#edf8ff,#a9c7e7)!important}
body[data-chapter] .cell[data-type="plane"]{background-image:linear-gradient(145deg,#f0fff8,#a5d4c3)!important}
body[data-chapter] .cell[data-type="heart"]{background-image:linear-gradient(145deg,#fff1ef,#edb3b6)!important}
body[data-chapter] .cell[data-type="faith"]{background-image:linear-gradient(145deg,#fff9dc,#e8ce83)!important}
body[data-chapter] .cell{box-shadow:inset 0 2px 1px #ffffffb3,inset 0 -4px 0 #75513827,0 2px 3px #553a302e}
.cell.pop::after{content:'✦';position:absolute;inset:0;display:grid;place-items:center;color:#fffbe0;text-shadow:0 1px 5px #e49e38;font-size:26px;pointer-events:none;animation:match-spark .24s ease-out forwards}
@keyframes match-spark{from{opacity:0;transform:scale(.45)}35%{opacity:1}to{opacity:0;transform:scale(1.6)}}
@media(max-width:370px){body[data-chapter] .board-frame{padding:3px}}
@media(max-height:700px){#screen-card .chapter-scene{max-height:150px}#screen-card .portrait{padding-top:8px}#screen-card .portrait img{width:54px;height:54px}#screen-card .card-text{margin-block:5px 10px}#screen-card .keepsake{padding-bottom:14px}}
/* The chapter picture is a real, unobstructed miniature, not a board texture. */
#screen-board{padding:8px 12px 20px}
.board-heading{display:flex;align-items:center;gap:8px;width:100%;max-width:430px;min-height:64px}
#screen-board .board-heading .btn-home{position:static;flex:none}
.board-heading-copy{flex:1;min-width:0}
#screen-board .level-label{margin:0;line-height:1.1}
#screen-board .board-name{max-width:none;min-height:0;margin:0;line-height:1.08}
#board-scene{display:block;flex:none;width:130px;aspect-ratio:800/420;object-fit:contain;border:2px solid #fff8e9;border-radius:9px;background:var(--scene);box-shadow:0 2px 0 var(--detail)}
#screen-board .counter{margin:3px 0;padding:0 12px;line-height:1.1}
#screen-board .counter .tgt{width:34px;height:34px}
#screen-board .guide{margin:3px 0;line-height:1.15}
#screen-board .board-frame{max-width:350px;padding:4px}
#screen-board .board{gap:2px}
#screen-board .board-actions{margin-top:6px;flex-direction:row;justify-content:center}
#screen-board .board-avatar{position:static;width:42px;height:42px;flex:none}
@media(max-width:370px){#screen-board{padding-inline:6px}#board-scene{width:100px}.board-heading{gap:5px}}
/* Give the album chapters different compositions while retaining their copy. */
/* The illustrated story comes first in both visual and reading order. */
body:is([data-chapter="2"],[data-chapter="5"],[data-chapter="8"]) #screen-card .keepsake{background:var(--scene);text-align:center;border-radius:32px 32px 20px 20px}
body:is([data-chapter="2"],[data-chapter="5"],[data-chapter="8"]) #screen-card .portrait{justify-content:center}
#screen-card .card-title::before,#screen-card .card-title::after{content:'✦';font-size:17px;color:#a86d37;vertical-align:middle;margin:0 10px}
/* The scene itself carries the story; game-piece badges obscured the artwork. */
#screen-card .reward-mark{display:none}
/* Other milestones pair a larger portrait with their illustrated memory. */
body:is([data-chapter="3"],[data-chapter="6"],[data-chapter="9"]) #screen-card .keepsake{display:grid;grid-template-columns:1fr 112px;align-items:center;padding:16px 16px 20px;gap:0 12px}
body:is([data-chapter="3"],[data-chapter="6"],[data-chapter="9"]) #screen-card .chapter-scene{grid-column:1;grid-row:1;width:100%;margin:0;border:3px solid var(--detail);border-radius:16px}
body:is([data-chapter="3"],[data-chapter="6"],[data-chapter="9"]) #screen-card .portrait{grid-column:2;grid-row:1;justify-content:center;padding:0}
body:is([data-chapter="3"],[data-chapter="6"],[data-chapter="9"]) #screen-card .portrait img{width:96px;height:96px}
body:is([data-chapter="3"],[data-chapter="6"],[data-chapter="9"]) #screen-card .portrait::after{content:none}
body:is([data-chapter="3"],[data-chapter="6"],[data-chapter="9"]) #screen-card :is(.card-title,.chapter-name,.card-text,.chapter-progress,.btn){grid-column:1 / -1}
body:is([data-chapter="3"],[data-chapter="6"],[data-chapter="9"]) #screen-card .reward-mark{top:22px;inset-inline-start:22px;width:46px;height:46px}
/* Four editorial stagings: an open page, a panoramic milestone,
   a paired portrait, and a family-story spread. Navigation stays fixed. */
#screen-card .card-title::before,#screen-card .card-title::after{content:none}
#screen-card .portrait::after{content:none}
body:is([data-chapter="1"],[data-chapter="4"],[data-chapter="7"]) #screen-card .keepsake{display:grid;grid-template-columns:82px 1fr;align-items:center;gap:0 12px;padding:0 0 20px;background:transparent;border:0;border-radius:0;box-shadow:none;text-align:right}
body:is([data-chapter="1"],[data-chapter="4"],[data-chapter="7"]) #screen-card .chapter-scene{grid-column:1/-1;width:100%;height:auto;max-height:190px;border:0;border-radius:8px;box-shadow:0 6px 0 var(--detail)}
body:is([data-chapter="1"],[data-chapter="4"],[data-chapter="7"]) #screen-card .portrait{grid-column:1;grid-row:2;padding:14px 0 0;justify-content:center}
body:is([data-chapter="1"],[data-chapter="4"],[data-chapter="7"]) #screen-card .portrait img{width:68px;height:68px}
body:is([data-chapter="1"],[data-chapter="4"],[data-chapter="7"]) #screen-card .card-title{grid-column:2;grid-row:2;margin:14px 0 0;font-size:28px}
body:is([data-chapter="1"],[data-chapter="4"],[data-chapter="7"]) #screen-card :is(.chapter-name,.card-text,.chapter-progress,.btn){grid-column:1/-1}
body:is([data-chapter="1"],[data-chapter="4"],[data-chapter="7"]) #screen-card :is(.chapter-name,.card-text){margin-inline:0}
body:is([data-chapter="2"],[data-chapter="5"]) #screen-card .keepsake{border-radius:3px;background:#fff9eb;border-width:0;box-shadow:0 3px 0 var(--detail),0 14px 30px #66462c24;text-align:center}
body:is([data-chapter="2"],[data-chapter="5"]) #screen-card .chapter-scene{height:170px;aspect-ratio:auto;object-fit:cover;border:0}
body:is([data-chapter="2"],[data-chapter="5"]) #screen-card .portrait{justify-content:center;padding-top:10px}
body:is([data-chapter="2"],[data-chapter="5"]) #screen-card .portrait img{width:54px;height:54px;border-radius:50%}
body:is([data-chapter="3"],[data-chapter="6"]) #screen-card .keepsake{border-radius:4px;background:#fffaf0}
body:is([data-chapter="3"],[data-chapter="6"]) #screen-card .chapter-name{font-size:23px}
body:is([data-chapter="8"],[data-chapter="9"]) #screen-card .keepsake{display:grid;grid-template-columns:92px 1fr;align-items:center;gap:0 12px;padding:15px 15px 20px;background:#fff9ed;border:0;border-radius:4px;box-shadow:0 10px 25px #66462c30;text-align:right}
body:is([data-chapter="8"],[data-chapter="9"]) #screen-card .chapter-scene{grid-column:1/-1;grid-row:1;width:100%;height:155px;max-height:none;margin:0;object-fit:cover;border:0;border-radius:2px}
body:is([data-chapter="8"],[data-chapter="9"]) #screen-card .portrait{grid-column:1;grid-row:2;padding:12px 0 0;justify-content:center}
body:is([data-chapter="8"],[data-chapter="9"]) #screen-card .portrait img{width:76px;height:76px;border-radius:50%}
body:is([data-chapter="8"],[data-chapter="9"]) #screen-card .card-title{grid-column:2;grid-row:2;margin:12px 0 0}
body:is([data-chapter="8"],[data-chapter="9"]) #screen-card :is(.chapter-name,.card-text,.chapter-progress,.btn){grid-column:1/-1}
body:is([data-chapter="8"],[data-chapter="9"]) #screen-card .chapter-name{font-size:24px;margin:8px 0 0}
body:is([data-chapter="8"],[data-chapter="9"]) #screen-card .card-text{margin-inline:0}
@media(max-height:700px){body:is([data-chapter="1"],[data-chapter="4"],[data-chapter="7"]) #screen-card .chapter-scene{max-height:145px}body:is([data-chapter="2"],[data-chapter="5"],[data-chapter="8"],[data-chapter="9"]) #screen-card .chapter-scene{height:125px}}
/* The family chapters are three different pages of the same album.
   The existing landscapes are symbolic, not pictures of the real family. */
body[data-chapter="7"] #screen-card .keepsake{display:grid;grid-template-columns:minmax(0,1fr) 96px;gap:0 12px;padding:16px;background:#fffaf0;border:2px solid var(--detail);border-radius:5px;box-shadow:0 10px 24px #66462c25}
body[data-chapter="7"] #screen-card .chapter-scene{grid-column:1;grid-row:1;width:100%;height:150px;max-height:none;object-fit:cover;border:0;border-radius:3px;box-shadow:none}
body[data-chapter="7"] #screen-card .portrait{grid-column:2;grid-row:1;padding:0}
body[data-chapter="7"] #screen-card .portrait img{width:88px;height:88px;border-radius:50%}
body[data-chapter="7"] #screen-card .card-title{grid-column:1/-1;grid-row:auto;margin:14px 0 0}
body[data-chapter="7"] #screen-card .chapter-name{font-size:23px}
body[data-chapter="8"] #screen-card .keepsake{display:block;padding:0 0 18px;border-radius:4px;background:#fffaf0;text-align:right}
body[data-chapter="8"] #screen-card .chapter-scene{width:100%;height:185px;border-radius:0;object-fit:cover}
body[data-chapter="8"] #screen-card .portrait{padding:12px 20px 0;justify-content:flex-start}
body[data-chapter="8"] #screen-card .portrait img{width:58px;height:58px;border-radius:12px}
body[data-chapter="8"] #screen-card .card-title{margin:8px 20px 0}
body[data-chapter="8"] #screen-card .chapter-name{margin:0 20px;font-size:23px}
body[data-chapter="8"] #screen-card .card-text{margin:8px 20px 14px}
body[data-chapter="9"] #screen-card .keepsake{grid-template-columns:76px minmax(0,1fr);padding:14px 14px 18px;background:#fffdf5;border:2px solid var(--detail);border-radius:20px 4px 20px 4px}
body[data-chapter="9"] #screen-card .chapter-scene{height:175px;border:8px solid #fff;border-bottom-width:14px;border-radius:2px;box-shadow:0 2px 8px #66462c30;object-fit:cover}
body[data-chapter="9"] #screen-card .portrait img{width:64px;height:64px;border-radius:50%}
body[data-chapter="9"] #screen-card .chapter-name{font-size:23px}
@media(max-height:700px){body[data-chapter="7"] #screen-card .chapter-scene{height:120px}body[data-chapter="8"] #screen-card .chapter-scene,body[data-chapter="9"] #screen-card .chapter-scene{height:125px}}
/* Original confectionery treatment; symbols remain the primary shape cue. */
body[data-chapter] .cell{box-shadow:inset 0 2px 4px #fff9,inset 0 -5px 5px #67402738,0 2px 2px #45230d40}
.cell .candy-art{filter:drop-shadow(0 2px 1px #42261d80) drop-shadow(0 4px 3px #42261d55)}
.board-frame{position:relative}
.guide{position:relative} #match-feedback{position:absolute;inset:0;z-index:6;pointer-events:none;display:grid;place-items:center;background:#fff9e9;color:#733725;border:2px solid #b87d45;border-radius:12px;padding:2px 8px;font-size:20px;font-weight:800}
#match-feedback:empty{display:none}
.cell.power-row::after,.cell.power-column::after{content:'↔';position:absolute;inset:4px;display:grid;place-items:center;color:#fff;font-size:30px;font-weight:900;text-shadow:0 1px 3px #40200c,0 0 5px #40200c;outline:3px solid #fff3a4;border-radius:12px;pointer-events:none}
.cell.power-column::after{content:'↕'}
.collected-pulse{animation:counter-bounce .25s ease-out}
@keyframes counter-bounce{50%{transform:scale(1.06);box-shadow:0 0 0 4px #e9b75e}}
/* Candy sits on a continuous sugared tray, not square buttons. */
body[data-chapter] .board{background:#8b5c49;gap:2px}
body[data-chapter] .cell, body[data-chapter] .cell[data-type]{background:transparent!important;background-image:none!important;box-shadow:inset 0 0 0 1px #fff2,inset 0 -2px 4px #35170824;padding:0}
@media(min-height:740px){#screen-board{justify-content:center}}
@media(max-height:700px){#screen-board{padding-bottom:4px}}
.cell .candy-art{max-width:none;width:100%;height:100%;filter:drop-shadow(0 3px 1px #48281999) drop-shadow(0 4px 3px #48281955)}
body[data-chapter] .cell.selected{box-shadow:inset 0 0 0 3px #fff7aa,0 0 0 3px #582719;outline:2px solid #582719}
</style>

<script>
/*ENGINE-START*/
(function () {
  'use strict';
  const COLS = 6, ROWS = 6;
  const TYPES = ['fruit','ball','shield','plane','heart','faith'];

  function pickWeighted(weights) {
    const total = weights.reduce(function(a,b){return a+b;},0);
    let r = Math.random() * total;
    for (let i=0;i<weights.length;i++){ r -= weights[i]; if (r < 0) return i; }
    return weights.length - 1;
  }

  function makeBoard(targetType) {
    // target type appears more often so collecting stays quick and frustration-free
    for (let attempt=0; attempt<8; attempt++) {
      const board = [];
      for (let r=0;r<ROWS;r++){
        const row = [];
        for (let c=0;c<COLS;c++){
          const w = TYPES.map(function(t){ return t === targetType ? 2.0 : 1.0; });
          let idx, guard = 0;
          do {
            idx = pickWeighted(w);
            guard++;
          } while (
            guard < 200 && (
              (c>=2 && row[c-1]===TYPES[idx] && row[c-2]===TYPES[idx]) ||
              (r>=2 && board[r-1][c]===TYPES[idx] && board[r-2][c]===TYPES[idx])
            )
          );
          row.push(TYPES[idx]);
        }
        board.push(row);
      }
      if (!hasMatch(board) && findMove(board)) return board;
    }
    // A proven playable layout also makes a broken or constant random source safe.
    const layout = [[4,2,4,5,2,0],[5,5,4,1,4,4],[1,2,0,4,4,5],[2,3,1,0,3,5],[0,4,4,5,0,4],[2,3,4,3,3,1]];
    const target = TYPES.indexOf(targetType);
    const order = TYPES.slice();
    if (target >= 0) [order[4],order[target]] = [order[target],order[4]];
    return layout.map(function(row){ return row.map(function(i){ return order[i]; }); });
  }

  function findMatches(board) {
    const cells = new Set();
    for (let r=0;r<ROWS;r++){
      let c=0;
      while (c<COLS){
        const t = board[r][c];
        if (t==null){ c++; continue; }
        let c2 = c+1;
        while (c2<COLS && board[r][c2]===t) c2++;
        if (c2-c>=3){ for (let k=c;k<c2;k++) cells.add(r+','+k); }
        c = c2;
      }
    }
    for (let c=0;c<COLS;c++){
      let r=0;
      while (r<ROWS){
        const t = board[r][c];
        if (t==null){ r++; continue; }
        let r2 = r+1;
        while (r2<ROWS && board[r2][c]===t) r2++;
        if (r2-r>=3){ for (let k=r;k<r2;k++) cells.add(k+','+c); }
        r = r2;
      }
    }
    return Array.from(cells).map(function(s){ const p=s.split(','); return [Number(p[0]),Number(p[1])]; });
  }

  function hasMatch(board){ return findMatches(board).length > 0; }

  // A four-or-more match instantly activates a striped candy. Each affected
  // cell is included once, even when several lines intersect.
  function clearPlan(board){
    const cells = new Set(findMatches(board).map(function(p){return p.join(',');}));
    const powers = [];
    function scan(axis, outer, inner){
      for(let line=0;line<outer;line++){
        let start=0;
        while(start<inner){
          const value = axis==='row' ? board[line][start] : board[start][line];
          let end=start+1;
          while(value!=null && end<inner && (axis==='row' ? board[line][end] : board[end][line])===value) end++;
          if(value!=null && end-start>=4){
            const r=axis==='row'?line:start, c=axis==='row'?start:line;
            powers.push({r:r,c:c,axis:axis});
            for(let i=0;i<inner;i++) cells.add(axis==='row' ? line+','+i : i+','+line);
          }
          start=end;
        }
      }
    }
    scan('row',ROWS,COLS); scan('column',COLS,ROWS);
    return {cells:Array.from(cells,function(s){return s.split(',').map(Number);}), powers:powers};
  }

  function swap(board, r1,c1,r2,c2){
    const t = board[r1][c1]; board[r1][c1] = board[r2][c2]; board[r2][c2] = t;
  }

  function findMove(board) {
    for (let r=0;r<ROWS;r++){
      for (let c=0;c<COLS;c++){
        if (c+1<COLS){
          swap(board,r,c,r,c+1);
          if (hasMatch(board)){ swap(board,r,c,r,c+1); return {r1:r,c1:c,r2:r,c2:c+1}; }
          swap(board,r,c,r,c+1);
        }
        if (r+1<ROWS){
          swap(board,r,c,r+1,c);
          if (hasMatch(board)){ swap(board,r,c,r+1,c); return {r1:r,c1:c,r2:r+1,c2:c}; }
          swap(board,r,c,r+1,c);
        }
      }
    }
    return null;
  }

  function collapseAndRefill(board) {
    const nb = [];
    for (let r=0;r<ROWS;r++) nb.push(new Array(COLS).fill(null));
    for (let c=0;c<COLS;c++){
      const col = [];
      for (let r=0;r<ROWS;r++){ if (board[r][c]!=null) col.push(board[r][c]); }
      let r = ROWS-1;
      for (let i=col.length-1;i>=0;i--){ nb[r--][c] = col[i]; }
      while (r>=0){ nb[r--][c] = TYPES[Math.floor(Math.random()*TYPES.length)]; }
    }
    return nb;
  }

  function resolveBoard(board, targetType) {
    let cleared = 0;
    const steps = [];
    let b = board;
    let guard = 0;
    while (guard++ < 500) {
      const m = clearPlan(b).cells;
      if (m.length===0) break;
      let targetCleared = 0;
      for (const cell of m){ if (b[cell[0]][cell[1]]===targetType) targetCleared++; }
      cleared += targetCleared;
      steps.push({ cells: m, targetCleared: targetCleared });
      for (const cell of m){ b[cell[0]][cell[1]] = null; }
      b = collapseAndRefill(b);
    }
    if (hasMatch(b)) b = makeBoard(targetType);
    return { board: b, cleared: cleared, steps: steps };
  }

  function shuffleBoard(targetType){ return makeBoard(targetType); }

  globalThis.__ENGINE = {
    COLS:COLS, ROWS:ROWS, TYPES:TYPES,
    makeBoard:makeBoard, findMatches:findMatches, clearPlan:clearPlan, hasMatch:hasMatch, findMove:findMove,
    collapseAndRefill:collapseAndRefill, resolveBoard:resolveBoard, shuffleBoard:shuffleBoard, swap:swap
  };
})();
/*ENGINE-END*/
</script>

<script>
(function(){
  'use strict';
  const E = globalThis.__ENGINE;
  const EMOJI = { ball:'⚽', shield:'🛡️', plane:'✈️', heart:'❤️', faith:'🕯️' };

  // ---- 10 stages: texts exactly as approved (do not reword) ----
  const LEVELS = [
    { name:'השורשים — אמא שרה', target:'heart', count:8,  fruit:'🍎',
      card:'יורם, הבן של שרה. מכאן מתחיל הסיפור שלך.' },

      intro:'הקבוצה שלך: הפועל חיפה 🔴⚽',
      card:'גדלת בחיפה, והפכת לאיש חזק שלא מוותר.' },
    { name:'גיל 26, דלת לדלת', target:'fruit', count:12, fruit:'🍊',
      card:'התחלת במכירת חומרי ניקוי מדלת לדלת. לא פחדת מעבודה קשה.' },
    { name:'במו ידיו', target:'shield', count:12, fruit:'🍓',
      card:'את כל מה שיש לך בנית בעצמך, במו ידיך.' },
    { name:'איש מאמין', target:'faith', count:12, fruit:'🍑',
      card:'כל בוקר אתה מניח תפילין. ככה מתחיל יום של אדם חזק ומאמין.' },
    { name:'המגן של המשפחות', target:'shield', count:15, fruit:'🍍',
      card:'סוכן ביטוח מצטיין. דאגת לכל כך הרבה משפחות, ועשית טוב לכל כך הרבה אנשים.' },
    { name:'אבא למופת', target:'heart', count:15, fruit:'🍌',
      card:'האבא של שי וגלי. אבא למופת, תמיד שם בשביל הילדים שלו.' },
    { name:'המשפחה הגדולה', target:'heart', count:18, fruit:'🍒',
      card:'אלה אשתך, אולגה ואריאל, אילנה ובר — משפחה שלמה סביבך, אוהבת אותך.' },
    { name:'סבא יורם', target:'fruit', count:18, fruit:'🥝',
      card:'הסבא של מילי וג\'יימי. הן אוהבות את סבא שלהן.' },
    { name:'מטייל בעולם — הגיבור שלנו', target:'plane', count:20, fruit:'🍉',
      card:'טיילת בעולם, אהבת את החיים — ואתה הגיבור שלנו. המשפחה שלך אוהבת אותך ומחכה לך.' }
  ];

  const STORAGE_KEY = 'yoram-hero-v1';

  const el = function(id){ return document.getElementById(id); };
  // A locally embedded illustration is visible while chapter art loads and if it fails.
  const sceneFallback = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420"><rect width="800" height="420" fill="#f6e5c9"/><circle cx="620" cy="90" r="48" fill="#f3c96b"/><path d="M0 305 Q190 155 400 305 Q600 160 800 285 V420 H0Z" fill="#c4d5b0"/><path d="M0 355 Q215 235 420 355 Q600 275 800 335 V420 H0Z" fill="#9eb98c"/><path d="M400 290 C355 250 300 300 400 365 C500 300 445 250 400 290Z" fill="#c95b4d"/></svg>');
  document.querySelectorAll('#intro-scene, #board-scene, .chapter-scene').forEach(function(image){
    image.style.backgroundImage = 'url("' + sceneFallback + '")';
    image.style.backgroundSize = 'cover';
    image.addEventListener('error', function(){ if(image.src !== sceneFallback) image.src = sceneFallback; });
  });
  const grid = el('grid');

  const state = { levelIndex:0, collected:0, board:null, selected:null, busy:false, started:false, pending:false, cascadeSeen:[] };

  function level(){ return LEVELS[state.levelIndex]; }
  function emojiFor(t, lv){ return t === 'fruit' ? lv.fruit : EMOJI[t]; }
  function targetEmoji(lv){ return lv.target === 'fruit' ? lv.fruit : EMOJI[lv.target]; }
  const names = {fruit:'פרי',ball:'כדורגל',shield:'מגן',plane:'מטוס',heart:'לב',faith:'אור'};
  const goalNames = {fruit:'פירות',ball:'כדורי כדורגל',shield:'מגנים',plane:'מטוסים',heart:'לבבות',faith:'אורות'};
  const chapterIntros = ['הסיפור מתחיל עם אמא שרה.', 'הקבוצה שלך: הפועל חיפה 🔴⚽', 'בגיל 26 התחיל המסע מדלת לדלת.', 'סיפור על מה שבנית במו ידיך.', 'פותחים את הבוקר באמונה.', 'סיפור על הדאגה למשפחות.', 'פרק על אבא של שי וגלי.', 'פרק על המשפחה הגדולה שלך.', 'סבא יורם ומילי וג׳יימי.', 'המסע בעולם של הגיבור שלנו.'];
  const fruitSymbols = {'🍎':'apple','🍇':'grape','🍊':'orange','🍓':'strawberry','🍑':'peach','🍍':'pineapple','🍌':'banana','🍒':'cherry','🥝':'kiwi','🍉':'watermelon'};
  function candy(t){
    const symbol = t === 'fruit' ? 'assets/fruit-symbols.svg#fruit-'+fruitSymbols[level().fruit] : '#candy-'+t;
    return '<svg class="candy-art" aria-hidden="true" viewBox="0 0 64 64"><use href="'+symbol+'" xlink:href="'+symbol+'"></use></svg>';
  }

  // ---- screens ----
  function show(id){
    document.querySelectorAll('.screen').forEach(function(s){ s.classList.remove('active'); });
    el('confetti').replaceChildren();
    el(id).classList.add('active');
    if (id === 'screen-home') delete document.body.dataset.chapter;
    else document.body.dataset.chapter = String(state.levelIndex + 1);
  }

  // ---- progress ----
  function saveProgress(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify({ levelIndex:state.levelIndex, collected:state.collected, board:state.board, pending:state.pending, cascadeSeen:state.cascadeSeen })); }catch(e){}
  }
  function loadProgress(){
    try{
      const p = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if (p && typeof p.levelIndex === 'number') return p;
    }catch(e){}
    return null;
  }
  function clearProgress(){ try{ localStorage.removeItem(STORAGE_KEY); }catch(e){} }
  function hasProgress(){
    const p = loadProgress();
    return !!(p && (p.levelIndex > 0 || p.collected > 0 || p.board));
  }
  function refreshStartButton(){
    el('btn-start').textContent = hasProgress() ? 'ממשיכים' : 'מתחילים';
  }

  // ---- board rendering ----
  function cellEl(r,c){ return grid.querySelector('.cell[data-r="'+r+'"][data-c="'+c+'"]'); }

  function fallDistances(before){
    const distances = Array.from({length:E.ROWS},function(){return Array(E.COLS).fill(0);});
    for(let c=0;c<E.COLS;c++){
      let dest=E.ROWS-1;
      for(let r=E.ROWS-1;r>=0;r--){if(before[r][c]!=null){distances[dest][c]=dest-r;dest--;}}
      for(let r=dest;r>=0;r--) distances[r][c]=dest+1;
    }
    return distances;
  }
  function renderBoard(anim){
    const lv = level();
    grid.innerHTML = '';
    for (let r=0;r<E.ROWS;r++){
      for (let c=0;c<E.COLS;c++){
        const cell = document.createElement('button');
        cell.type = 'button';
        const drop=anim && anim[r][c];
        cell.className = 'cell' + (drop ? ' fall-in' : '');
        if(drop) cell.style.setProperty('--fall-distance',(-drop*(grid.clientWidth/6))+'px');
        const t = state.board[r][c];
        cell.innerHTML = candy(t);
        cell.setAttribute('data-r', r);
        cell.setAttribute('data-c', c);
        cell.setAttribute('data-type', t);
        cell.setAttribute('aria-label', 'אריח ' + names[t] + ', שורה ' + (r+1) + ', טור ' + (c+1));
        cell.addEventListener('click', function(){ onCellTap(r,c); });
        grid.appendChild(cell);
      }
    }
  }

  function updateCounter(){
    const lv = level();
    const shown = Math.min(state.collected, lv.count);
    el('counter').innerHTML = 'אספת <b>'+shown+'</b> מתוך <b>'+lv.count+'</b> '+goalNames[lv.target]+' <span class="tgt">'+candy(lv.target)+'</span>';
  }

  // ---- input ----
  function onCellTap(r,c){
    if (state.busy) return;
    const sel = state.selected;
    if (!sel){ state.selected = {r:r,c:c}; markSelected(r,c,true); return; }
    if (sel.r===r && sel.c===c){ markSelected(r,c,false); state.selected=null; return; }
    const dist = Math.abs(sel.r-r) + Math.abs(sel.c-c);
    if (dist===1){ attemptSwap(sel,{r:r,c:c}); }
    else { markSelected(sel.r,sel.c,false); state.selected={r:r,c:c}; markSelected(r,c,true); }
  }
  function markSelected(r,c,on){
    const cell = cellEl(r,c);
    if (cell) cell.classList.toggle('selected', on);
  }

  function attemptSwap(a,b){
    state.busy = true;
    state.selected = null;
    const first = cellEl(a.r,a.c), second = cellEl(b.r,b.c);
    const x = second.offsetLeft-first.offsetLeft, y = second.offsetTop-first.offsetTop;
    first.style.setProperty('--dx',x+'px'); first.style.setProperty('--dy',y+'px');
    second.style.setProperty('--dx',-x+'px'); second.style.setProperty('--dy',-y+'px');
    first.classList.add('swap-motion'); second.classList.add('swap-motion');
    E.swap(state.board, a.r,a.c,b.r,b.c);
    const valid = E.hasMatch(state.board);
    if (valid){ state.pending = true; state.cascadeSeen = []; saveProgress(); }
    setTimeout(function(){
      if(valid){ renderBoard(); cascadeStep(); }
      else {
        first.style.setProperty('--dx','0px'); first.style.setProperty('--dy','0px');
        second.style.setProperty('--dx','0px'); second.style.setProperty('--dy','0px');
        E.swap(state.board,a.r,a.c,b.r,b.c);
        setTimeout(function(){renderBoard(); state.busy=false;},200);
      }
    },200);
  }

  function cascadeStep(){
    if (state.cascadeSeen.length >= 128){
      state.board = E.makeBoard(level().target);
      renderBoard();
      finishTurn();
      return;
    }
    const plan = E.clearPlan(state.board), m = plan.cells;
    if (m.length === 0){ finishTurn(); return; }
    const accelerated = state.cascadeSeen.length >= 8;
    state.cascadeSeen.push(1);
    let cleared = 0;
    m.forEach(function(cell){ if (state.board[cell[0]][cell[1]] === level().target) cleared++; });
    state.collected += cleared;
    updateCounter();
    const feedback = el('match-feedback');
    feedback.textContent = plan.powers.length ? 'חץ הקסם מנקה!' : (state.cascadeSeen.length > 1 ? 'רצף נהדר!' : (cleared ? 'יופי! +' + cleared : 'כל הכבוד!'));
    plan.powers.forEach(function(p){ const cell=cellEl(p.r,p.c); if(cell){ cell.classList.add('power-'+p.axis); cell.setAttribute('aria-label',cell.getAttribute('aria-label') + (p.axis==='row' ? ', חץ שמנקה שורה' : ', חץ שמנקה טור')); } });
    if (cleared) { el('counter').classList.remove('collected-pulse'); void el('counter').offsetWidth; el('counter').classList.add('collected-pulse'); }
    m.forEach(function(cell){ const c=cellEl(cell[0],cell[1]); if(c) c.classList.add('pop'); });
    setTimeout(function(){
      feedback.textContent = '';
      el('counter').classList.remove('collected-pulse');
      m.forEach(function(cell){ state.board[cell[0]][cell[1]] = null; });
      const distances=fallDistances(state.board);
      state.board = E.collapseAndRefill(state.board);
      saveProgress();
      renderBoard(distances);
      if (state.collected >= level().count){ setTimeout(finishLevel, accelerated ? 0 : 240); return; }
      // An exceptionally long chain must not trap the player forever.
      if (state.cascadeSeen.length >= 128){
        state.board = E.makeBoard(level().target);
        renderBoard();
        finishTurn();
        return;
      }
      setTimeout(cascadeStep, accelerated ? 0 : 250);
    }, accelerated ? 0 : 240);
  }

  function finishTurn(){
    if (!E.findMove(state.board)){
      state.board = E.shuffleBoard(level().target);
      renderBoard();
      const mv = E.findMove(state.board);
      if (mv) flashHint(mv);
    }
    state.busy = false;
    state.selected = null;
    state.pending = false;
    state.cascadeSeen = [];
    saveProgress();
  }

  function flashHint(move){
    flashClass({r:move.r1,c:move.c1}, 'hint', 1400);
    flashClass({r:move.r2,c:move.c2}, 'hint', 1400);
  }
  function flashClass(cell, cls, ms){
    const c = cellEl(cell.r, cell.c);
    if (c){ c.classList.add(cls); setTimeout(function(){ c.classList.remove(cls); }, ms||260); }
  }
  function shake(cell){
    const c = cellEl(cell.r, cell.c);
    if (c){ c.classList.add('shake'); setTimeout(function(){ c.classList.remove('shake'); }, 260); }
  }

  function finishLevel(){
    state.collected = level().count;
    state.busy = false;
    state.pending = false;
    saveProgress();
    if (state.levelIndex === LEVELS.length-1){ showFinale(); }
    else { showHeroCard(); }
  }

  // ---- level screens ----
  function showIntro(){
    const lv = level();
    el('intro-scene').src = 'assets/scenes/chapter-'+String(state.levelIndex+1).padStart(2,'0')+'.jpg';
    el('intro-badge').innerHTML = candy(lv.target);
    el('intro-name').textContent = lv.name;
    el('intro-line').textContent = chapterIntros[state.levelIndex];
    el('intro-line').style.display = '';
    refreshStartButton();
    show('screen-intro');
  }

  function showBoard(){
    const lv = level();
    el('board-frame').style.setProperty('--chapter-art', 'url("assets/scenes/chapter-'+String(state.levelIndex+1).padStart(2,'0')+'.jpg")');
    el('board-scene').src = 'assets/scenes/chapter-'+String(state.levelIndex+1).padStart(2,'0')+'.jpg';
    if (state.collected >= lv.count){ finishLevel(); return; }
    if (!state.board) state.board = E.makeBoard(lv.target);
    state.selected = null; state.busy = state.pending;
    el('level-label').textContent = 'שלב ' + (state.levelIndex+1) + ' מתוך ' + LEVELS.length;
    el('board-name').textContent = lv.name;
    el('board-frame').classList.toggle('red', !!lv.red);
    updateCounter();
    renderBoard();
    saveProgress();
    show('screen-board');
    if (state.pending) setTimeout(cascadeStep, 0);
  }

  function showHeroCard(){
    el('card-scene').src = 'assets/scenes/chapter-' + String(state.levelIndex + 1).padStart(2,'0') + '.jpg';
    el('card-text').textContent = level().card;
    el('card-chapter').textContent = level().name;
    el('reward-mark').innerHTML = candy(level().target);
    el('chapter-progress').replaceChildren(...LEVELS.map(function(_, i){
      const mark = document.createElement('span');
      if(i <= state.levelIndex) mark.className = 'done';
      return mark;
    }));
    show('screen-card');
    burstConfetti();
  }

  function showFinale(){
    el('finale-text').textContent = LEVELS[LEVELS.length-1].card;
    show('screen-finale');
    burstConfetti();
  }

  function advance(){
    state.levelIndex++;
    state.collected = 0;
    state.board = null;
    state.pending = false;
    saveProgress();
    showIntro();
  }

  function goHome(){
    if (state.busy) return;
    refreshStartButton();
    show('screen-home');
  }

  function hint(){
    if (state.busy) return;
    let mv = E.findMove(state.board);
    if (!mv){
      state.board = E.shuffleBoard(level().target);
      renderBoard();
      mv = E.findMove(state.board);
      saveProgress();
    }
    if (mv) flashHint(mv);
  }

  // ---- confetti ----
  const reduceMotion = (typeof matchMedia === 'function') && matchMedia('(prefers-reduced-motion: reduce)').matches;
  function burstConfetti(){
    if (reduceMotion) return;
    const bits = ['#d85a49','#e6ac47','#5c9c79','#6d9eb3','#c58bba'];
    const box = el('confetti');
    for (let i=0;i<22;i++){
      const s = document.createElement('span');
      s.className = 'confetti-bit';
      s.style.background = bits[i % bits.length];
      s.style.left = (Math.random()*100) + 'vw';
      s.style.fontSize = (16 + Math.random()*18) + 'px';
      s.style.animationDuration = '.28s';
      s.style.animationDelay = '0s';
      box.appendChild(s);
      (function(node){ setTimeout(function(){ if (node.parentNode) node.parentNode.removeChild(node); }, 3600); })(s);
    }
  }

  // ---- wiring ----
  el('btn-start').addEventListener('click', function(){
    const p = loadProgress();
    if (p && (p.levelIndex > 0 || p.collected > 0 || p.board)){
      state.levelIndex = p.levelIndex;
      state.collected = p.collected;
      const validBoard = Array.isArray(p.board) && p.board.length === E.ROWS && p.board.every(function(row){ return Array.isArray(row) && row.length === E.COLS && row.every(function(t){ return E.TYPES.includes(t); }); });
      state.pending = !!(validBoard && p.pending);
      state.cascadeSeen = state.pending && Array.isArray(p.cascadeSeen) ? p.cascadeSeen.slice(0,128) : [];
      state.board = validBoard && (state.pending || (!E.hasMatch(p.board) && E.findMove(p.board))) ? p.board : null;
      showIntro();
    } else {
      clearProgress();
      state.levelIndex = 0; state.collected = 0; state.board = null; state.pending = false;
      showIntro();
    }
  });
  el('btn-play').addEventListener('click', showBoard);
  el('btn-hint').addEventListener('click', hint);
  el('btn-next').addEventListener('click', advance);
  el('btn-replay').addEventListener('click', function(){
    clearProgress();
    state.levelIndex = 0; state.collected = 0; state.board = null; state.pending = false;
    showIntro();
  });
  document.querySelectorAll('.btn-home').forEach(function(b){ b.addEventListener('click', goHome); });

  // ---- expose for tests ----
  globalThis.__GAME = {
    LEVELS: LEVELS, E: E, state: state,
    level: level, emojiFor: emojiFor, targetEmoji: targetEmoji,
    makeBoard: E.makeBoard, findMove: E.findMove, findMatches: E.findMatches,
    resolveBoard: E.resolveBoard, collapseAndRefill: E.collapseAndRefill,
    showIntro: showIntro, showBoard: showBoard, showHeroCard: showHeroCard, showFinale: showFinale,
    onCellTap: onCellTap, cascadeStep: cascadeStep, finishTurn: finishTurn
  };

  // ---- boot ----
  refreshStartButton();
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  }
})();
</script>
